<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Survey Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 40px 15px;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #3498db;
            overflow: hidden;
        }

        .header {
            padding: 25px 30px;
            border-bottom: 1px solid #eee;
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 24px;
        }

        .header p {
            margin: 0;
            color: #7f8c8d;
            font-size: 14px;
        }

        form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 14px;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #3498db;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .radio-item input, .checkbox-item input {
            cursor: pointer;
        }

        .btn-submit {
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Customer Survey Form</h1>
            <p>Please take a few minutes to help us improve our service by filling out this survey.</p>
        </div>

        <form action="#" method="POST">
            
            <!-- Họ và Tên -->
            <div class="form-group grid-2">
                <div>
                    <label for="first-name">First Name <span class="required">*</span></label>
                    <input type="text" id="first-name" name="first_name" class="form-control" required>
                </div>
                <div>
                    <label for="last-name">Last Name <span class="required">*</span></label>
                    <input type="text" id="last-name" name="last_name" class="form-control" required>
                </div>
            </div>

            <!-- Email & Phone -->
            <div class="form-group grid-2">
                <div>
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@domain.com" required>
                </div>
                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="0901234567">
                </div>
            </div>

            <!-- Mức độ hài lòng -->
            <div class="form-group">
                <label>Overall, how satisfied were you with our service? <span class="required">*</span></label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="satisfaction" value="very_satisfied" required> Very Satisfied</label>
                    <label class="radio-item"><input type="radio" name="satisfaction" value="satisfied"> Satisfied</label>
                    <label class="radio-item"><input type="radio" name="satisfaction" value="neutral"> Neutral</label>
                    <label class="radio-item"><input type="radio" name="satisfaction" value="unsatisfied"> Unsatisfied</label>
                    <label class="radio-item"><input type="radio" name="satisfaction" value="very_unsatisfied"> Very Unsatisfied</label>
                </div>
            </div>

            <!-- Tần suất sử dụng dịch vụ -->
            <div class="form-group">
                <label for="frequency">How often do you use our service? <span class="required">*</span></label>
                <select id="frequency" name="frequency" class="form-control" required>
                    <option value="">-- Select Option --</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="rarely">Rarely</option>
                </select>
            </div>

            <!-- Sản phẩm/Dịch vụ quan tâm -->
            <div class="form-group">
                <label>What features or services are you most interested in?</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" name="interests" value="quality"> High Product Quality</label>
                    <label class="checkbox-item"><input type="checkbox" name="interests" value="support"> Customer Support</label>
                    <label class="checkbox-item"><input type="checkbox" name="interests" value="pricing"> Affordable Pricing</label>
                    <label class="checkbox-item"><input type="checkbox" name="interests" value="usability"> Ease of Use</label>
                </div>
            </div>

            <!-- Ý kiến đóng góp -->
            <div class="form-group">
                <label for="comments">Do you have any additional comments or suggestions?</label>
                <textarea id="comments" name="comments" class="form-control" rows="4" placeholder="Type your response here..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Survey</button>

        </form>
    </div>

</body>
</html>
